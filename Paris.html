   <!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Paris Photo Album</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    h1 { text-align: center; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <h1>Photo Album</h1>
  <div class="gallery">
    <img src="images/photo1.jpg" alt="">
    <img src="images/photo2.jpg" alt="">
    <img src="images/photo3.jpg" alt="">
  </div>
</body>
</html>
